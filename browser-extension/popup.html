<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>haochen 网页追踪</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark">h</span><div><h1>交给 haochen 关注</h1><p>只追踪你选择的页面</p></div></header>
  <section class="bridge"><p id="bridge-status" role="status">正在检查本机连接…</p>
    <button id="reconnect" class="subtle">重新连接</button>
    <details><summary>首次连接</summary><p>在 haochen「来源连接 → Chrome」填写下方扩展 ID，点击安装桥接。</p>
      <code id="extension-id"></code><button id="copy-id" class="subtle">复制扩展 ID</button></details></section>
  <section><h2>当前页面</h2><p id="page-title">正在获取当前页面…</p>
    <button id="track" disabled>授权此网站并追踪当前页</button>
    <p class="hint">授权后定期读取此页文字，只发送到本机 haochen。不读取输入框、密码、Cookie、无痕页面；不会追踪同站点的其他页面。图片和跨域框架暂不包含。</p></section>
  <p id="notice" role="status" aria-live="polite"></p>
  <section><h2>正在关注 <span id="count">0</span></h2><div id="sources"></div></section>
  <footer>切换到其他网址不会被偷偷改读。<br>移除来源立即停止追踪；可在扩展设置撤回站点权限。</footer>
  <script src="popup.js"></script>
</body></html>
