name: Bug 报告
description: 报告可复现的功能、交互或稳定性问题
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 请先删除截图和日志中的 API Key、个人屏幕内容、用户名与本地路径。
  - type: input
    id: version
    attributes:
      label: haochen 版本
      placeholder: 例如 0.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与设备
      placeholder: 例如 macOS 15.x / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 实际发生了什么？对使用有什么影响？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 唤起桌宠…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的证据
      description: 可提供截图、录屏或日志摘要；不要上传敏感数据。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除凭据、私人会话和个人屏幕内容
          required: true
