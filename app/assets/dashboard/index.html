<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>haochen · 总览</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="icons.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body data-palette="sage">
  <div id="dashboard">
    <main id="overview" aria-label="haochen 总览">
      <header class="app-heading">
        <button class="brand" type="button" data-action="collapse" aria-label="收起总览">
          <span class="wordmark">haochen<span></span></span>
          <span class="tagline">让重要的事，自然浮现。</span>
        </button>
        <div class="heading-actions">
          <button class="report-trigger quiet-button" type="button" data-action="report" data-focuskey="report"><span data-icon="notebook"></span><span>今日日报</span></button>
          <button class="icon-button" type="button" data-action="connections" data-focuskey="connections" aria-label="连接与外观设置" title="连接与外观"><span data-icon="settings"></span></button>
          <button class="icon-button collapse-button" type="button" data-action="collapse" aria-label="收起总览" title="收起总览"><span data-icon="minimize"></span></button>
        </div>
      </header>
      <div id="connection-banner" class="notice" hidden></div>
      <div class="main-grid">
        <section class="events-section" aria-labelledby="events-title">
          <header class="section-heading"><h1 id="events-title">应用动态</h1><div class="section-tools"><span id="event-count" class="muted"></span><button class="icon-button" type="button" data-action="refresh" data-focuskey="refresh" aria-label="检查最新动态" title="检查最新动态"><span data-icon="refresh"></span></button></div></header>
          <div id="event-list" class="event-list"></div>
          <footer class="events-footer"><span id="updated-label">正在连接本机服务</span><button class="text-button" type="button" data-action="connections">管理连接 <span data-icon="arrow-up-right"></span></button></footer>
        </section>
        <aside class="side-panels">
          <section class="tracking-section" aria-labelledby="tracks-title">
            <header class="section-heading"><h2 id="tracks-title">我在追踪</h2><button class="text-button" type="button" data-action="track-new" data-focuskey="track-new"><span data-icon="plus"></span>新事项</button></header>
            <div id="track-list"></div>
          </section>
          <section class="calendar-section" aria-labelledby="calendar-title">
            <header class="section-heading"><h2 id="calendar-title">接下来</h2><span data-icon="calendar"></span></header>
            <div id="calendar-list"></div>
          </section>
        </aside>
      </div>
      <section id="file-shelf" class="file-shelf" aria-labelledby="files-title">
        <header><h2 id="files-title"><span data-icon="folder"></span>随手可达</h2><span class="shelf-hint">拖入文件夹，留在这里</span></header>
        <div id="file-list" class="file-list"></div>
        <div class="drop-layer" aria-hidden="true"><span data-icon="folder-plus"></span><span>松手收纳文件夹</span><small>仅添加快捷入口，不移动原文件</small></div>
      </section>
      <footer class="app-footer"><span id="service-status"><span class="presence-dot"></span>本机连接中</span><button class="text-button" type="button" data-action="ask-global" aria-label="唤起独立的 haochen 助手">和 haochen 说句话 <span data-icon="arrow-up-right"></span></button></footer>
    </main>
    <div id="float-layer" class="float-layer" hidden>
      <div id="float-scrim" class="float-scrim"></div>
      <section id="float-window" class="float-window" role="dialog" aria-modal="true" aria-labelledby="float-title">
        <div id="float-content" class="float-content">
          <header class="float-heading"><span id="float-title" class="window-caption"></span><div class="window-tools"><span class="esc-hint">Esc 收起</span><button class="icon-button" type="button" data-action="modal-back" data-focuskey="modal-close" aria-label="关闭当前浮窗，Esc"><span data-icon="x"></span></button></div></header>
          <div id="float-body" class="float-body"></div>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
